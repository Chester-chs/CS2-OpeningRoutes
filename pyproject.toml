[project]
name = "openingroutes"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["demoparser2==0.42.1", "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pandas==3.1.0", "pyarrow==26.0.0", "pywebview==6.2.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.3", "pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
